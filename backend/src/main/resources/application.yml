server:
  port: ${PORT:8081}

spring:
  application:
    name: pedefacil-whatsapp-receiver
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQL10Dialect
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

automation:
  receiver-token: ${PEDEFACIL_RECEIVER_TOKEN:}
  signature-secret: ${PEDEFACIL_SIGNATURE_SECRET:}
  outbound-mode: ${OUTBOUND_MODE:log}
  outbound-url: ${AUTOMATION_OUTBOUND_URL:}
  outbound-bearer-token: ${AUTOMATION_OUTBOUND_BEARER_TOKEN:}
  evolution-base-url: ${AUTOMATION_EVOLUTION_BASE_URL:}
  evolution-api-key: ${AUTOMATION_EVOLUTION_API_KEY:}
  evolution-instance: ${AUTOMATION_EVOLUTION_INSTANCE:}
  zapi-base-url: ${AUTOMATION_ZAPI_BASE_URL:https://api.z-api.io}
  zapi-instance: ${AUTOMATION_ZAPI_INSTANCE:}
  zapi-token: ${AUTOMATION_ZAPI_TOKEN:}

payments:
  api-public-base-url: ${PAYMENTS_API_PUBLIC_BASE_URL:}
  allowed-origins: ${PAYMENTS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
  checkout-rate-limit-max: ${PAYMENTS_CHECKOUT_RATE_LIMIT_MAX:20}
  checkout-rate-limit-window-seconds: ${PAYMENTS_CHECKOUT_RATE_LIMIT_WINDOW_SECONDS:60}
  revalidate-rate-limit-max: ${PAYMENTS_REVALIDATE_RATE_LIMIT_MAX:30}
  revalidate-rate-limit-window-seconds: ${PAYMENTS_REVALIDATE_RATE_LIMIT_WINDOW_SECONDS:60}
  webhook-rate-limit-max: ${PAYMENTS_WEBHOOK_RATE_LIMIT_MAX:300}
  webhook-rate-limit-window-seconds: ${PAYMENTS_WEBHOOK_RATE_LIMIT_WINDOW_SECONDS:60}
  mercadopago-retry-max-attempts: ${MERCADOPAGO_RETRY_MAX_ATTEMPTS:3}
  mercadopago-retry-base-delay-ms: ${MERCADOPAGO_RETRY_BASE_DELAY_MS:250}
  trial-rollover-enabled: ${TRIAL_ROLLOVER_ENABLED:true}
  trial-rollover-cron: ${TRIAL_ROLLOVER_CRON:0 */10 * * * *}
  trial-rollover-batch-size: ${TRIAL_ROLLOVER_BATCH_SIZE:200}
  subscription-lifecycle-batch-size: ${SUBSCRIPTION_LIFECYCLE_BATCH_SIZE:200}
  stale-pending-max-minutes: ${STALE_PENDING_MAX_MINUTES:120}
  strict-startup-validation: ${PAYMENTS_STRICT_STARTUP_VALIDATION:true}
  ops-monitoring-enabled: ${PAYMENTS_OPS_MONITORING_ENABLED:true}
  ops-monitoring-cron: ${PAYMENTS_OPS_MONITORING_CRON:0 * * * * *}
  ops-reconciliation-cron: ${PAYMENTS_OPS_RECONCILIATION_CRON:0 0 6 * * *}
  ops-reconciliation-lookback-hours: ${PAYMENTS_OPS_RECONCILIATION_LOOKBACK_HOURS:24}
  ops-alert-webhook-url: ${PAYMENTS_OPS_ALERT_WEBHOOK_URL:}
  ops-alert-cooldown-minutes: ${PAYMENTS_OPS_ALERT_COOLDOWN_MINUTES:15}
  mercadopago-access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  mercadopago-api-base-url: ${MERCADOPAGO_API_BASE_URL:https://api.mercadopago.com}
  mercadopago-webhook-token: ${MERCADOPAGO_WEBHOOK_TOKEN:}
  supabase-url: ${SUPABASE_URL:}
  supabase-service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}

platform:
  auth:
    app-base-url: ${APP_BASE_URL:http://localhost:5173}
    jwt-secret: ${APP_AUTH_JWT_SECRET:}
    access-token-minutes: ${APP_AUTH_ACCESS_TOKEN_MINUTES:30}
    refresh-token-days: ${APP_AUTH_REFRESH_TOKEN_DAYS:30}
    email-verification-token-hours: ${APP_AUTH_EMAIL_VERIFICATION_TOKEN_HOURS:24}
    password-reset-token-minutes: ${APP_AUTH_PASSWORD_RESET_TOKEN_MINUTES:30}
    debug-expose-tokens: ${APP_AUTH_DEBUG_EXPOSE_TOKENS:false}

